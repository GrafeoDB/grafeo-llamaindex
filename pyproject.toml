[project]
name = "grafeo-llamaindex"
version = "0.3.0"
description = "LlamaIndex PropertyGraphStore backed by GrafeoDB embedded graph database"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "GrafeoDB" }]
keywords = ["llamaindex", "graph-rag", "property-graph", "grafeo", "knowledge-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database :: Database Engines/Servers",
]
dependencies = [
    "grafeo>=0.6.2,<0.7",
    "llama-index-core>=0.14,<1",
]

[project.urls]
Homepage = "https://github.com/GrafeoDB/grafeo-llamaindex"
Source = "https://github.com/GrafeoDB/grafeo-llamaindex"
Issues = "https://github.com/GrafeoDB/grafeo-llamaindex/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grafeo_llamaindex"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/README.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/LICENSE"]

# ── LlamaHub metadata (for discovery) ────────────────────────────────────────────────────────────
[tool.llamahub]
contains_example = true
import_path = "grafeo_llamaindex"

[tool.llamahub.class_authors]
GrafeoPropertyGraphStore = "GrafeoDB"

# ── Ruff ──────────────────────────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

# ── Ty ────────────────────────────────────────────────────────────────────────────────────────────
[tool.ty.environment]
python-version = "3.12"

# ── Pytest ────────────────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=grafeo_llamaindex --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]

# ── Coverage ─────────────────────────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["grafeo_llamaindex"]
omit = ["*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ── Dev dependencies (installed by uv sync) ──────────────────────────────────────────────────────
[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=0.25",
    "pytest-cov>=7",
    "pytest-timeout>=2",
    "ruff>=0.15",
    "ty>=0.0.16",
    "llama-index>=0.14",
    "pandas>=2",  # examples/graphrag_migration.py, so that ty resolves it
    "llama-index-llms-mistralai>=0.12",  # examples/basic_graph_rag.py, so that ty resolves it
    "llama-index-embeddings-mistralai>=0.7",
    "grafeo-datasets>=0.6.3",  # the Silicon Valley dataset of the examples
]
